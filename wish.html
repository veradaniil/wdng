<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо!</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #fdfaf6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .message { animation: fadeIn 2s ease-in; padding: 20px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.5em; color: #d4af37; } /* Чуть меньше размер, чтобы смотрелось аккуратнее */
        p { font-size: 1.2em; color: #4a4a4a; line-height: 1.6; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="message">
        <h1>Благодарим вас!</h1>
        <p>Нам будет очень жаль, что вы не сможете разделить этот день с нами,<br>но мы искренне ценим вашу поддержку и теплые слова.</p>
    </div>
</body>
</html>
