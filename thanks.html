<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо!</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #fdfaf6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .message { animation: fadeIn 2s ease-in; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3em; color: #d4af37; }
        p { font-size: 1.2em; color: #4a4a4a; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="message">
        <h1>Спасибо за ваш ответ!</h1>
        <p>Мы очень рады, что вы разделите этот день с нами.<br>До встречи!</p>
    </div>
</body>
</html>
